services:
  - type: web
    name: loadgo-arunachal-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace @loadgo/shared && npm run build --workspace @loadgo/api
    startCommand: node apps/api/dist/apps/api/src/server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_MOCK_SERVICES
        value: false
      - key: USE_IN_MEMORY_DB
        value: false
      - key: JWT_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: JWT_RATE_LIMIT_MAX
        value: 100
      - key: MATCHING_RADIUS_KM
        value: 15
      - key: DRIVER_OFFER_TIMEOUT_SECONDS
        value: 20
      - key: TRACKING_STALE_SECONDS
        value: 30
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    runtime: static
    name: loadgo-arunachal-admin
    plan: free
    buildCommand: npm install && npm run build --workspace @loadgo/shared && npm run build --workspace @loadgo/admin-web
    staticPublishPath: apps/admin-web/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_ADMIN_TOKEN
        value: dev-admin
